<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무궁화 · 웹캠 구역 설정</title><link rel="stylesheet" href="/style.css"><script src="/calibrate.js" defer></script></head>
<body><header><div class="brand">MUGUNGHWA <span>웹캠 구역 설정</span></div><a class="badge" href="/">테스트 화면으로</a></header>
<main><p class="eyebrow">CAMERA CALIBRATION</p><h1>현재 구도에서 구역을 지정하세요</h1><p>웹캠 사진 위를 클릭합니다. 설정 중에도 검출은 계속 실행됩니다. 카메라 위치를 옮기면 다시 설정하세요.</p>
<article class="panel"><div class="controls"><button id="refresh-frame">현재 화면 다시 가져오기</button><button data-mode="roi" class="selected">1. 게임 구역</button><button data-mode="line">2. 결승선</button><button data-mode="direction">3. 통과 방향</button><button id="undo">되돌리기</button><button id="clear">점 모두 지우기</button></div><p id="hint">게임 구역 가장자리를 순서대로 3점 이상 클릭하세요.</p><canvas id="calibration-canvas" width="640" height="480" aria-label="웹캠 구역과 결승선 설정"></canvas><p id="calibration-status" role="status">웹캠 화면을 가져오고 있습니다.</p><div class="controls"><button id="save-calibration" disabled>저장하고 테스트 화면으로</button><button id="remove-calibration" disabled>저장된 설정 해제</button><a class="badge" href="/">취소하고 돌아가기</a></div><p class="note">구역: 초록색 다각형 · 결승선: 노란색 선 · 통과 방향: 선을 넘은 뒤 도착할 쪽의 한 점. 저장하면 다음 검출부터 적용하고 기존 통과 후보를 초기화합니다.</p></article></main></body></html>
