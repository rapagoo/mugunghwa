<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무궁화 · 경기 현황</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><script src="/cycle.js" defer></script></head>
<body data-view="game"><header><a class="brand" href="/">MUGUNGHWA <span>무궁화 꽃이 피었습니다</span></a><span id="connection" class="badge" role="status">연결 확인 중</span></header>
<main><div class="heading"><div><p class="eyebrow">LIVE GAME</p><h1>경기 현황</h1></div><a class="badge" id="calibration-link" href="/calibrate">구역 설정</a></div>
<section class="panel cycle-panel" aria-label="경기 진행"><div class="panelhead"><h2>지금은</h2><span id="cycle-link" class="badge">연결 확인 중</span></div><p id="cycle-signal" class="cycle-signal" role="status">경기 준비 중</p><p id="cycle-stage" class="note"></p><p id="cycle-warning" class="note" role="status"></p></section>
<section class="layout"><article class="panel"><div class="panelhead"><h2>실시간 화면</h2><span id="vision-state">준비 중</span></div><div class="preview"><img id="stream" src="/stream.mjpg" alt="경기 구역과 참가자 실시간 화면"><div id="overlay">카메라 준비 중</div></div><div class="camera-caption"><span>화면 속 인원 <b id="people">—</b>명</span><span id="calibration-info">구역 확인 중</span></div></article>
<article class="panel game"><div class="panelhead"><h2>경기 정보</h2><span id="game-state" class="badge">경기 대기</span></div><small>남은 시간</small><div class="countdown" id="remaining">— : —</div><p id="game-meta" class="note">구역 안에 선 뒤 시작 버튼을 눌러주세요.</p><div class="totals"><div><strong id="total">—</strong><small>참가자</small></div><div><strong id="passed" class="passed">—</strong><small>통과</small></div><div><strong id="failed" class="failed">—</strong><small>탈락</small></div></div><h3>참가자 결과</h3><div id="participants" class="empty">경기가 시작되면 표시됩니다.</div></article></section>
</main><footer>무궁화 꽃이 피었습니다</footer></body></html>
